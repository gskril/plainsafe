# Release to IPFS (SPEC §12): on a v* tag, build reproducibly, compute the CID ourselves, check
# that omnipin gets the same one, pin to at least two providers, and attach the CID, dist.zip
# and the runtime dependency list to the GitHub release. See RELEASE.md.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      OMNIPIN_VERSION: 3.1.3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run lint && bun run test

      - name: Build
        run: bun run build

      - name: Compute the CID
        id: cid
        run: echo "cid=$(bun run --silent cid dist)" >> "$GITHUB_OUTPUT"

      - name: omnipin must get the same CID
        run: |
          theirs="$(bunx omnipin@${OMNIPIN_VERSION} pack dist --only-hash | tail -n 1)"
          echo "ours:    ${{ steps.cid.outputs.cid }}"
          echo "omnipin: ${theirs}"
          test "${theirs}" = "${{ steps.cid.outputs.cid }}"

      - name: At least two pinning providers are configured
        env:
          OMNIPIN_PINATA_TOKEN: ${{ secrets.OMNIPIN_PINATA_TOKEN }}
          OMNIPIN_LIGHTHOUSE_TOKEN: ${{ secrets.OMNIPIN_LIGHTHOUSE_TOKEN }}
          OMNIPIN_FILEBASE_TOKEN: ${{ secrets.OMNIPIN_FILEBASE_TOKEN }}
          OMNIPIN_4EVERLAND_TOKEN: ${{ secrets.OMNIPIN_4EVERLAND_TOKEN }}
          OMNIPIN_FILECOIN_TOKEN: ${{ secrets.OMNIPIN_FILECOIN_TOKEN }}
        run: |
          n=0
          for v in OMNIPIN_PINATA_TOKEN OMNIPIN_LIGHTHOUSE_TOKEN OMNIPIN_FILEBASE_TOKEN OMNIPIN_4EVERLAND_TOKEN OMNIPIN_FILECOIN_TOKEN; do
            if [ -n "${!v}" ]; then n=$((n + 1)); fi
          done
          echo "providers configured: ${n}"
          test "${n}" -ge 2

      - name: Pin with omnipin
        env:
          OMNIPIN_PINATA_TOKEN: ${{ secrets.OMNIPIN_PINATA_TOKEN }}
          OMNIPIN_LIGHTHOUSE_TOKEN: ${{ secrets.OMNIPIN_LIGHTHOUSE_TOKEN }}
          OMNIPIN_FILEBASE_TOKEN: ${{ secrets.OMNIPIN_FILEBASE_TOKEN }}
          OMNIPIN_4EVERLAND_TOKEN: ${{ secrets.OMNIPIN_4EVERLAND_TOKEN }}
          OMNIPIN_FILECOIN_TOKEN: ${{ secrets.OMNIPIN_FILECOIN_TOKEN }}
        run: bunx omnipin@${OMNIPIN_VERSION} deploy dist --strict

      - name: Release files
        run: |
          (cd dist && zip -X -r ../dist.zip .)
          bun pm ls > dependencies.txt
          echo "${{ steps.cid.outputs.cid }}" > CID.txt

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist.zip dependencies.txt CID.txt \
            --title "${GITHUB_REF_NAME}" \
            --notes "IPFS CID: \`${{ steps.cid.outputs.cid }}\`

          Open it at https://${{ steps.cid.outputs.cid }}.ipfs.dweb.link/ (a subdomain gateway), or run it locally with \`bunx serve dist\` from dist.zip. How to check the CID yourself: RELEASE.md."
